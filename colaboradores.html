<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Usuários - Admin Dashboard</title>
  <link rel="stylesheet" href="css/colaboradores.css" />
</head>

<body>
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <h2>Admin</h2>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="colaboradores.html" class="active">Colaboradores</a>
        <a href="relatorios.html">Relatórios</a>
        <a href="vendas.html">Vendas</a>
      </nav>
      <button id="toggleSidebar">☰</button>
    </aside>

    <main class="main">
      <header class="header">
        <h1>Usuários</h1>
      </header>

      <section class="actions">
        <input type="text" id="searchInput" placeholder="Pesquisar usuário..." />
        <button id="addUserBtn">Adicionar Usuário</button>
      </section>

      <section class="table-section">
        <table id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="userModal" class="modal">
    <div class="modal-content">
      <span class="closeBtn">&times;</span>
      <h2 id="modalTitle">Adicionar Usuário</h2>
      <form id="userForm">
        <input type="text" id="userName" placeholder="Nome" required />
        <input type="email" id="userEmail" placeholder="Email" required />
        <button type="submit" id="saveUserBtn">Salvar</button>
      </form>
    </div>
  </div>

  <script src="js/colaboradores.js"></script>
</body>

</html>
